<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="outer" x1="100" y1="60" x2="412" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0d070"/>
      <stop offset="100%" stop-color="#8a5010"/>
    </linearGradient>
    <linearGradient id="ball" x1="120" y1="100" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e07030"/>
      <stop offset="100%" stop-color="#a03808"/>
    </linearGradient>
    <clipPath id="inner-clip">
      <polygon points="256,112 376,178 376,310 256,376 136,310 136,178"/>
    </clipPath>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outer-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feFlood flood-color="#c9a84c" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle radial glow behind hex -->
  <ellipse cx="256" cy="244" rx="180" ry="160" fill="rgba(201,168,76,0.06)"/>

  <!-- Gold hex outer ring with glow -->
  <g filter="url(#outer-glow)">
    <polygon points="256,72 404,158 404,330 256,416 108,330 108,158" fill="url(#outer)"/>
  </g>

  <!-- Basketball face -->
  <polygon points="256,112 376,178 376,310 256,376 136,310 136,178" fill="url(#ball)"/>

  <!-- Bold basketball seams clipped to hex -->
  <g clip-path="url(#inner-clip)" stroke="#1a0800" stroke-linecap="round" fill="none">
    <!-- Left S-curve -->
    <path d="M256,116 Q316,244 256,372" stroke-width="14"/>
    <!-- Right S-curve -->
    <path d="M256,116 Q196,244 256,372" stroke-width="14"/>
    <!-- Horizontal seam -->
    <path d="M136,244 Q196,208 256,244 Q316,280 376,244" stroke-width="14"/>
  </g>

  <!-- Gold hex outer border -->
  <polygon points="256,72 404,158 404,330 256,416 108,330 108,158"
           fill="none" stroke="#f0d070" stroke-width="10"/>

  <!-- Inner hex border -->
  <polygon points="256,112 376,178 376,310 256,376 136,310 136,178"
           fill="none" stroke="#c06020" stroke-width="4" opacity="0.5"/>

  <!-- Wordmark below -->
  <text x="256" y="466" text-anchor="middle"
        font-family="'Georgia', serif"
        font-size="28" font-weight="700"
        fill="#c9a84c" letter-spacing="3">BASKETBALL DYNASTY</text>
</svg>
